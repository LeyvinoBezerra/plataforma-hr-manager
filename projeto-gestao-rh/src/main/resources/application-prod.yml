server:
  port: ${PORT:8080}

spring:

  application:
    name: gestao-rh

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false

    hibernate:
      ddl-auto: validate

springdoc:

  api-docs:
    enabled: false

  swagger-ui:
    enabled: false

jwt:
  secret: ${JWT_SECRET}

  expiration: 900000
